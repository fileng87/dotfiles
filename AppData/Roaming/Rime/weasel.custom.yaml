# weasel.custom.yaml
# 小狼毫外觀客製化：Windows 11 現代風格（跟隨系統亮／暗模式）、縮小比例
# 說明：
#   - 顏色一律採用 Weasel 的 0xBBGGRR（BGR）格式，非一般網頁常見的 RRGGBB
#   - style/color_scheme 為淺色模式配色，style/color_scheme_dark 為深色模式配色
#     Windows 切換系統佈景（設定 > 個人化 > 色彩）時會自動套用對應配色
#   - 高亮採用 Win11 原生風格：不整塊反白，改用左側圓角色塊（mark）+ 強調色文字
#   - 如果之後想改回小狼毫預設外觀，把這個檔案清空存檔即可

patch:
  style:
    color_scheme: win11_light
    color_scheme_dark: win11_dark

    font_point: 12          # 預設 14，中幅縮小
    label_font_point: 12
    comment_font_point: 11

    mark_text: ""            # 留空 + hilited_mark_color 才會畫出左側色塊
    hover_type: hilite        # 滑鼠移到候選字上也會反白，體驗更貼近系統選單

    layout:
      min_width: 120          # 預設 160，中幅縮小
      border_width: 1         # Win11 浮出視窗有一圈極細邊框，而非完全無邊框
      margin_x: 10             # 與 margin_y 一致，四邊留白相同
      margin_y: 10             # 與 margin_x 一致，四邊留白相同
      spacing: 16               # 緩衝區／組字區與候選字區之間的間隔
      candidate_spacing: 4     # 預設 5
      hilite_spacing: 4        # 預設 4
      hilite_padding: 6        # 讓每一行候選字有舒適的點擊／視覺高度
      corner_radius: 8         # 視窗外框圓角，對齊 Win11 浮出選單的圓角
      round_corner: 6          # 高亮色塊（mark）圓角，別名 hilited_corner_radius
      shadow_radius: 12        # Win11 用陰影表現層級，取代粗邊框
      shadow_offset_x: 0
      shadow_offset_y: 4

  preset_color_schemes:
    win11_light:
      name: "Windows 11／Light"
      author: "custom"
      text_color: 0x1B1B1B
      back_color: 0xF3F3F3
      border_color: 0xE5E5E5
      shadow_color: 0x33000000
      hilited_text_color: 0x1B1B1B
      hilited_back_color: 0xDBDBDB              # 緩衝區（組字）反白：灰色
      hilited_shadow_color: 0x00000000
      candidate_text_color: 0x1B1B1B
      candidate_back_color: 0xF3F3F3
      candidate_shadow_color: 0x00000000
      hilited_candidate_text_color: 0xB85F00      # 強調藍 #005FB8
      hilited_candidate_back_color: 0xFBF1E8       # 淡藍色底（強調色低透明感）
      hilited_candidate_shadow_color: 0x00000000
      comment_text_color: 0x5C5C5C
      hilited_comment_text_color: 0xB07F3E
      label_color: 0x8A8A8A
      hilited_label_color: 0xB85F00
      hilited_mark_color: 0xB85F00                 # 左側色塊顏色 = 強調藍

    win11_dark:
      name: "Windows 11／Dark"
      author: "custom"
      text_color: 0xE4E4E4
      back_color: 0x2B2B2B
      border_color: 0x3D3D3D
      shadow_color: 0x40000000
      hilited_text_color: 0xE4E4E4
      hilited_back_color: 0x484848              # 緩衝區（組字）反白：灰色
      hilited_shadow_color: 0x00000000
      candidate_text_color: 0xE4E4E4
      candidate_back_color: 0x2B2B2B
      candidate_shadow_color: 0x00000000
      hilited_candidate_text_color: 0xFFC24C        # 深色模式強調藍 #4CC2FF（Win11 深色主題常用亮藍）
      hilited_candidate_back_color: 0x4A3821
      hilited_candidate_shadow_color: 0x00000000
      comment_text_color: 0xA0A0A0
      hilited_comment_text_color: 0xE0B87F
      label_color: 0x8A8A8A
      hilited_label_color: 0xFFC24C
      hilited_mark_color: 0xFFC24C
